<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(0,113,227,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#86868b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#000"/>
  <!-- Radial glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Badge -->
  <rect x="436" y="140" width="328" height="36" rx="18" fill="rgba(0,113,227,0.15)"/>
  <text x="600" y="164" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0071e3">Edit your dummies in Minutes</text>
  <!-- Title line 1 -->
  <text x="600" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#f5f5f7" letter-spacing="-2">Momentum,</text>
  <!-- Title line 2 -->
  <text x="600" y="345" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#textFade)" letter-spacing="-2">made effortless</text>
  <!-- Subtitle -->
  <text x="600" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#86868b">Transform your template into a viral movement.</text>
  <text x="600" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#86868b">One frame, infinite personalized updates, zero friction.</text>
  <!-- CTA button -->
  <rect x="460" y="480" width="280" height="56" rx="28" fill="#f5f5f7"/>
  <text x="600" y="515" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#000">Launch your campaign</text>
  <!-- Logo -->
  <text x="600" y="600" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#555">Dummy.io</text>
</svg>
